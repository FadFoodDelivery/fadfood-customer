<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - FadFood Kairouan</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4757;
            --dark-color: #2f3542;
            --light-pink: #fceae8;
            --grey-text: #747d8c;
            --border-radius: 12px;
            --big-border-radius: 30px;
            --font-family: 'Tajawal', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }
        body {
            background-color: var(--light-pink);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .logo-container {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .login-header h1 {
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .login-header p {
            color: var(--grey-text);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            width: 100%;
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark-color);
        }
        .input-field {
            width: 100%;
            padding: 15px 20px;
            border-radius: var(--big-border-radius);
            border: 1px solid #e9ecef;
            background-color: #f8f9fa;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 2px;
        }
        .input-field:focus {
            border-color: var(--primary-color);
            background-color: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--big-border-radius);
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #e84118;
        }
        .back-link {
            color: var(--grey-text);
            font-size: 14px;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: var(--primary-color);
        }
        .otp-section {
            display: none;
        }
        .timer-text {
            font-size: 13px;
            color: var(--grey-text);
            margin-bottom: 15px;
        }
        .social-login-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-top: 15px;
        }
        .social-login-btn {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #e9ecef;
            background-color: #f8f9fa;
            color: var(--dark-color);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .social-login-btn.fb { color: #1877f2; }
        .social-login-btn.ig { color: #e1306c; }
        .social-login-btn.wa { color: #25d366; }
        .social-login-btn:hover {
            background-color: #f1f2f6;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--grey-text);
            font-size: 13px;
            margin: 20px 0;
            width: 100%;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e9ecef;
        }
        .divider::before { margin-left: 10px; }
        .divider::after { margin-right: 10px; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="logo-container">
            <img src="images/logo.png" alt="شعار FadFood">
        </div>

        <!-- خطوة إدخال رقم الهاتف أو الربط الاجتماعي -->
        <div id="phone-step" style="width: 100%;">
            <div class="login-header">
                <h1>تسجيل الدخول</h1>
                <p>أدخل رقم هاتفك أو اربط حسابك لتأكيد هويتك وتجنب الطلبات المزيفة</p>
            </div>
            
            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" class="input-field" placeholder="مثال: 55073503" dir="ltr" required>
            </div>
            <button type="button" class="btn-submit" onclick="sendOtpCode()">إرسال رمز التأكيد</button>

            <div class="divider">أو ربط الحساب عبر مواقع التواصل</div>

            <div class="social-login-grid">
                <a href="#" onclick="socialLogin('Facebook')" class="social-login-btn fb"><i class="fab fa-facebook-f"></i> فايسبوك</a>
                <a href="#" onclick="socialLogin('Instagram')" class="social-login-btn ig"><i class="fab fa-instagram"></i> انستغرام</a>
                <a href="#" onclick="socialLogin('WhatsApp')" class="social-login-btn wa"><i class="fab fa-whatsapp"></i> واتساب</a>
            </div>
        </div>

        <!-- خطوة إدخال رمز التحقق OTP -->
        <div id="otp-step" class="otp-section" style="width: 100%;">
            <div class="login-header">
                <h1>تأكيد الرمز</h1>
                <p>تم إرسال رمز التحقق المكون من 4 أرقام إلى هاتفك</p>
            </div>
            <div class="timer-text" id="otp-hint">رمز التجربة الوهمي للتأكيد: <strong style="color: var(--primary-color);" id="generated-code">1234</strong></div>
            <div class="form-group">
                <label for="otp-code">رمز التحقق (OTP)</label>
                <input type="text" id="otp-code" class="input-field" maxlength="4" placeholder="••••" required>
            </div>
            <button type="button" class="btn-submit" onclick="verifyOtpCode()">تأكيد الحساب والدخول</button>
        </div>

        <a href="login.html" class="back-link" style="margin-top: 20px;"><i class="fas fa-arrow-right"></i> العودة</a>
    </div>

    <script>
        let correctOtp = "1234";

        function sendOtpCode() {
            const phone = document.getElementById('phone').value.trim();
            if(!phone || phone.length < 8) {
                alert('الرجاء إدخال رقم هاتف صحيح');
                return;
            }
            correctOtp = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('generated-code').innerText = correctOtp;
            
            document.getElementById('phone-step').style.display = 'none';
            document.getElementById('otp-step').style.display = 'block';
            alert('تم محاكاة إرسال رسالة نصية SMS برمز التأكيد رقم: ' + correctOtp);
        }

        function verifyOtpCode() {
            const enteredOtp = document.getElementById('otp-code').value.trim();
            if(enteredOtp === correctOtp) {
                alert('تم تأكيد الحساب بنجاح!');
                // الانتقال المباشر لصفحة اختيار نوع الخدمة/الطلب بعد تأكيد الحساب
                window.location.href = 'categories.html';
            } else {
                alert('رمز التحقق غير صحيح، حاول مرة أخرى');
            }
        }

        function socialLogin(provider) {
            alert('تم ربط حسابك بنجاح عبر ' + provider + ' وتأكيد الهوية!');
            // الانتقال المباشر لصفحة اختيار نوع الخدمة/الطلب بعد الربط الاجتماعي
            window.location.href = 'categories.html';
        }
    </script>
</body>
</html>
