<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FadFood Kairouan - أمانة في كل توصيلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4757;
            --dark-color: #2f3542;
            --light-pink: #fceae8;
            --grey-text: #747d8c;
            --border-radius: 12px;
            --big-border-radius: 30px;
            --font-family: 'Tajawal', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }
        body {
            background-color: var(--light-pink);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .top-tagline {
            color: #b38b4d;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .logo-timer-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .logo-timer-container img {
            width: 180px;
            height: auto;
            object-fit: contain;
        }
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 25px;
        }
        .dot {
            width: 8px;
            height: 4px;
            background-color: #ffcccc;
            border-radius: 4px;
        }
        .dot.active {
            background-color: var(--primary-color);
            width: 22px;
        }
        .welcome-text h1 {
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .welcome-text p {
            color: var(--grey-text);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }
        .category-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }
        .btn-category {
            background-color: #fff0f0;
            color: var(--dark-color);
            border: 1px solid #ffe0e0;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-category i {
            color: var(--primary-color);
        }
        .location-selector {
            background-color: #f8f9fa;
            width: 100%;
            max-width: 350px;
            padding: 14px 20px;
            border-radius: var(--big-border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
            cursor: pointer;
        }
        .location-selector i.fa-map-marker-alt {
            color: var(--primary-color);
        }
        .location-selector span {
            font-weight: 700;
            font-size: 15px;
        }
        .btn-start {
            width: 100%;
            max-width: 350px;
            padding: 16px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--big-border-radius);
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            margin-bottom: 30px;
            text-decoration: none;
            display: inline-block;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #f1f2f6;
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-tagline">أمانة في كل توصيلة</div>
        <div class="logo-timer-container">
            <img src="images/logo.png" alt="شعار FadFood">
        </div>
        <div class="slider-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot active"></div>
        </div>
        <div class="welcome-text">
            <h1>أهلاً وسهلاً بك في FadFood</h1>
            <p>فريقنا يعمل بأمانة وتفانٍ ليصل طعامك وطلباتك إليك بسرعة وثقة تستحقها — لأن راحتكم أولويتنا في كل طلب</p>
        </div>
        <div class="category-buttons">
            <button class="btn-category"><i class="fas fa-shopping-cart"></i> تسوق</button>
            <button class="btn-category"><i class="fas fa-box"></i> طلبات</button>
            <button class="btn-category"><i class="fas fa-utensils"></i> مأكولات</button>
        </div>
        <div class="location-selector">
            <span>القيروان، تونس</span>
            <i class="fas fa-map-marker-alt"></i>
        </div>
        <a href="login.html" class="btn-start">ابدأ الطلب</a>
        <div class="social-links">
            <a href="tel:+216..." class="social-icon"><i class="fas fa-phone"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>
</body>
</html>
