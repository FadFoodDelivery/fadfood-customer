<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FadFood Kairouan - القائمة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4757;
            --dark-color: #2f3542;
            --light-pink: #fceae8;
            --grey-text: #747d8c;
            --font-family: 'Tajawal', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }
        body {
            background-color: var(--light-pink);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 80vh;
        }
        .search-bar {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid #e9ecef;
            background-color: #f8f9fa;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
            text-align: right;
        }
        .categories-filter {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            background-color: #f8f9fa;
            color: var(--grey-text);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }
        .section-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--dark-color);
            text-align: right;
        }
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 80px;
        }
        .item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid #f1f2f6;
            border-radius: 24px;
            padding: 12px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .item-info {
            text-align: right;
            flex: 1;
            padding-left: 10px;
        }
        .item-info h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .item-info p {
            font-size: 12px;
            color: var(--grey-text);
            margin-bottom: 6px;
        }
        .item-price {
            font-size: 15px;
            font-weight: 900;
            color: var(--primary-color);
        }
        .item-img {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            object-fit: cover;
            margin-left: 12px;
        }
        .add-btn {
            width: 36px;
            height: 36px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }
        .cart-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background-color: var(--primary-color);
            color: #fff;
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <input type="text" class="search-bar" placeholder="ابحث عن وجبتك المفضلة...">

        <div class="categories-filter">
            <button class="filter-btn active">الكل</button>
            <button class="filter-btn">بيتزا</button>
            <button class="filter-btn">برجر</button>
            <button class="filter-btn">كفتجي</button>
        </div>

        <div class="section-title">القائمة المتوفرة</div>

        <div class="items-list">
            <div class="item-card">
                <button class="add-btn"><i class="fas fa-plus"></i></button>
                <div class="item-info">
                    <h3>بيتزا السلطان</h3>
                    <p>صلصة، موزاريلا، زيتون</p>
                    <div class="item-price">DT 15.000</div>
                </div>
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=150" alt="بيتزا" class="item-img">
            </div>

            <div class="item-card">
                <button class="add-btn"><i class="fas fa-plus"></i></button>
                <div class="item-info">
                    <h3>برجر هاوس</h3>
                    <p>لحم بقري، جبنة، صوص خاص</p>
                    <div class="item-price">DT 12.500</div>
                </div>
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150" alt="برجر" class="item-img">
            </div>

            <div class="item-card">
                <button class="add-btn"><i class="fas fa-plus"></i></button>
                <div class="item-info">
                    <h3>صحن كفتجي</h3>
                    <p>خضار مشكلة، بيض، تن</p>
                    <div class="item-price">DT 8.000</div>
                </div>
                <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=150" alt="كفتجي" class="item-img">
            </div>
        </div>

        <div class="cart-bar">
            <span>سلة الطلبات (0)</span>
            <span>DT 0.000</span>
        </div>
    </div>
</body>
</html>
